name: Build
on:
  workflow_call:
    inputs:
      plugin_name:
        required: true
        type: string
        description: 'The name of the plugin (e.g. woocommerce-services)'
    outputs:
      plugin_name:
        description: "The name of the plugin"
        value: ${{ jobs.build.outputs.plugin_name }}

jobs:
  build:
    name: Build plugin artifact (zip file)
    runs-on: ubuntu-latest
    outputs:
      plugin_name: ${{ inputs.plugin_name }}
    env:
      PLUGIN_NAME: ${{ inputs.plugin_name }}
    steps:
      - name: Set Git to use HTTPS instead of SSH
        run: git config --global url.https://github.com/.insteadOf git://github.com/

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build plugin zip
        run: npm run build

      # Re-zip so the archive has a single top-level directory matching the plugin slug (required by QIT).
      - name: Re-zip with parent directory for QIT
        run: |
          PLUGIN_NAME="${{ env.PLUGIN_NAME }}"
          unzip -q -d "$PLUGIN_NAME" "$PLUGIN_NAME.zip"
          rm "$PLUGIN_NAME.zip"
          zip -rq "$PLUGIN_NAME.zip" "$PLUGIN_NAME"
          rm -rf "$PLUGIN_NAME"

      - name: Debug — plugin name and zip structure
        run: |
          echo "::group::Build debug: plugin name and zip contents"
          echo "PLUGIN_NAME (env): ${{ env.PLUGIN_NAME }}"
          echo "inputs.plugin_name: ${{ inputs.plugin_name }}"
          echo ""
          ZIPFILE="${{ env.PLUGIN_NAME }}.zip"
          echo "Zip file: $ZIPFILE"
          if [ -f "$ZIPFILE" ]; then
            echo "Zip exists. Listing contents (first 45 lines):"
            unzip -l "$ZIPFILE" | head -45
            echo ""
            echo "First path in archive (QIT expects single top-level dir matching slug):"
            unzip -l "$ZIPFILE" | sed -n '4p'
          else
            echo "ERROR: Zip file not found."
            ls -la
          fi
          echo "::endgroup::"
        env:
          PLUGIN_NAME: ${{ env.PLUGIN_NAME }}

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}
          path: ${{ env.PLUGIN_NAME }}.zip
