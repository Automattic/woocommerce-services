name: Build
on:
  workflow_call:
    inputs:
      plugin_name:
        required: true
        type: string
        description: 'The name of the plugin (e.g. woocommerce-services)'
    outputs:
      plugin_name:
        description: "The name of the plugin"
        value: ${{ jobs.build.outputs.plugin_name }}

jobs:
  build:
    name: Build plugin artifact (zip file)
    runs-on: ubuntu-latest
    outputs:
      plugin_name: ${{ inputs.plugin_name }}
    env:
      PLUGIN_NAME: ${{ inputs.plugin_name }}
    steps:
      - name: Set Git to use HTTPS instead of SSH
        run: git config --global url.https://github.com/.insteadOf git://github.com/

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build plugin zip
        run: npm run build

      - name: Debug — plugin name and zip structure
        run: |
          echo "::group::Build debug: plugin name and zip contents"
          echo "PLUGIN_NAME (env): ${{ env.PLUGIN_NAME }}"
          echo "inputs.plugin_name: ${{ inputs.plugin_name }}"
          echo ""
          echo "Zip file: ${{ env.PLUGIN_NAME }}.zip"
          if [ -f "${{ env.PLUGIN_NAME }}.zip" ]; then
            echo "Zip exists. Listing contents (first 40 entries):"
            unzip -l "${{ env.PLUGIN_NAME }}.zip" | head -40
            echo ""
            echo "Top-level entries (no path prefix):"
            unzip -l "${{ env.PLUGIN_NAME }}.zip" | awk 'NR>3 { print $4 }' | while read -r entry; do
              case "$entry" in
                */*) echo "  (nested) $entry" ;;
                *)   echo "  (root)   $entry" ;;
              esac
            done | head -30
          else
            echo "ERROR: Zip file not found."
            ls -la
          fi
          echo "::endgroup::"
        env:
          PLUGIN_NAME: ${{ env.PLUGIN_NAME }}

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}
          path: ${{ env.PLUGIN_NAME }}.zip
