name: Build
on:
  workflow_call:
    inputs:
      plugin_name:
        required: true
        type: string
        description: 'The name of the plugin (e.g. woocommerce-services)'
    outputs:
      plugin_name:
        description: "The name of the plugin"
        value: ${{ jobs.build.outputs.plugin_name }}

permissions:
  contents: read

jobs:
  build:
    name: Build plugin artifact (zip file)
    runs-on: ubuntu-latest
    outputs:
      plugin_name: ${{ inputs.plugin_name }}
    env:
      PLUGIN_NAME: ${{ inputs.plugin_name }}
    steps:
      - name: Set Git to use HTTPS instead of SSH
        run: git config --global url.https://github.com/.insteadOf git://github.com/

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '8.2'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build plugin zip
        run: npm run build

      # Re-zip so the archive has a single top-level directory matching the plugin slug (required by QIT).
      - name: Re-zip with parent directory for QIT
        run: |
          PLUGIN_NAME="${{ env.PLUGIN_NAME }}"
          unzip -q -d "$PLUGIN_NAME" "$PLUGIN_NAME.zip"
          rm "$PLUGIN_NAME.zip"
          zip -rq "$PLUGIN_NAME.zip" "$PLUGIN_NAME"
          rm -rf "$PLUGIN_NAME"

      - name: Upload plugin zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PLUGIN_NAME }}
          path: ${{ env.PLUGIN_NAME }}.zip
