name: QIT Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - trunk

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build project
    # QIT needs the partner secrets, which forks and Dependabot do not receive.
    if: ${{ github.event_name == 'workflow_dispatch' || ( github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' ) }}
    uses: ./.github/workflows/build.yml
    with:
      plugin_name: woocommerce-services

  qit-tests:
    name: QIT Tests
    needs: build
    uses: ./.github/workflows/qit_runner.yml
    secrets: inherit
    with:
      extension: ${{ needs.build.outputs.plugin_name }}
      artifact: ${{ needs.build.outputs.plugin_name }}
      test-activation: 'true'
      test-security: 'true'
      test-plugin-check: 'false' # Plugin Check runs through .github/workflows/plugin_check.yml instead.

  plugin-check:
    name: Plugin Check
    needs: build
    uses: ./.github/workflows/plugin_check.yml
    with:
      extension: ${{ needs.build.outputs.plugin_name }}
      artifact: ${{ needs.build.outputs.plugin_name }}

  # Not for forks or Dependabot: the build job above is skipped for them, and their token cannot comment.
  test-the-build:
    name: Test the build
    if: ${{ github.event_name == 'pull_request' }}
    needs: build
    permissions:
      pull-requests: write
    uses: ./.github/workflows/test_the_build.yml
    secrets:
      JETPACK_BETA_BUILDER_SECRET: ${{ secrets.JETPACK_BETA_BUILDER_SECRET }}
    with:
      extension: ${{ needs.build.outputs.plugin_name }}
      artifact: ${{ needs.build.outputs.plugin_name }}
